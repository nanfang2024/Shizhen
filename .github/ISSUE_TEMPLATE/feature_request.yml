name: 功能建议
description: 建议新的公开平台适配、本地转换能力或使用体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景，而不只是某个实现方案。拾帧不会加入登录绕过、付费绕过、DRM 绕过或访问控制规避功能。
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的交互或结果
    validations:
      required: true
  - type: input
    id: public_reference
    attributes:
      label: 可公开访问的参考链接
      description: 可选；不要提交登录凭据、付费内容或私人资源。
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代方法
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议只涉及用户有权处理的公开内容或本地文件。
          required: true
