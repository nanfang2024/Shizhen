changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 文档与维护
      labels:
        - documentation
        - maintenance
        - dependencies
    - title: 其他变更
      labels:
        - "*"
